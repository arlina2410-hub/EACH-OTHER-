name = "each-other-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = false

[vars]
ENVIRONMENT = "development"
D1_SOFT_WARN_BYTES = "400000000"
D1_MAX_BYTES = "524288000"

[[d1_databases]]
binding = "DB"
database_name = "each-other-db-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Production environment is intentionally left unconfigured until explicit user approval.
# Secrets (NEVER commit, NEVER place in [vars]):
#   npx wrangler secret put JWT_SIGNING_SECRET
#   npx wrangler secret put CODE_HASH_PEPPER
